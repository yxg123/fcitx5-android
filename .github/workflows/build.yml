name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [master, feature/force-landscape]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4
        with:
          packages: cmake;3.31.6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK (debug-signed)
        run: |
          # 生成临时调试签名密钥(仅用于内部测试;正式发布请用公司 keystore,通过仓库 Secrets 提供)
          keytool -genkeypair -v -keystore debug.keystore -storetype PKCS12 \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          export SIGN_KEY_BASE64="$(base64 -w0 debug.keystore)"
          export SIGN_KEY_PWD="android"
          export SIGN_KEY_ALIAS="androiddebugkey"
          ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/
          if-no-files-found: error
